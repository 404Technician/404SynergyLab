name: Validate and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run web:build
      - run: npm run validate
      - run: npm run audit:check
      - run: npm run demo
      - run: npm run lab -- lightning-arrow
  provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/checkout@v4
        with:
          repository: PathOfBuildingCommunity/PathOfBuilding-PoE2
          ref: bb52d6b368307457eb9c54bb13f1829993d390b1
          path: .upstream-pob
      - run: npm run import:pob -- .upstream-pob --check
      - run: npm run discovery:check -- .upstream-pob
      - run: npm run skills:coverage -- --check
      - run: npm run catalog:import -- .upstream-pob --check
      - run: npm run mechanics:import -- .upstream-pob --check
      - run: npm run chains:check -- .upstream-pob
      - run: npm run details:import -- .upstream-pob --check
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
        env:
          SCREENSHOT_DIR: artifacts/browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-screenshots
          path: artifacts/browser
          retention-days: 7
          if-no-files-found: ignore

  publish:
    name: Publish GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [test, provenance, browser]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Build the static lab
        run: npm run web:build
      - name: Upload the static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Show the testing URL
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: echo "Open the lab at $PAGE_URL" >> "$GITHUB_STEP_SUMMARY"
