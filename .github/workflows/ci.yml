name: Validate and test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run web:build
      - run: npm run validate
      - run: npm run audit:check
      - run: npm run demo
      - run: npm run lab -- lightning-arrow
  provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/checkout@v4
        with:
          repository: PathOfBuildingCommunity/PathOfBuilding-PoE2
          ref: bb52d6b368307457eb9c54bb13f1829993d390b1
          path: .upstream-pob
      - run: npm run import:pob -- .upstream-pob --check
      - run: npm run discovery:check -- .upstream-pob
      - run: npm run catalog:import -- .upstream-pob --check
      - run: npm run mechanics:import -- .upstream-pob --check
      - run: npm run chains:check -- .upstream-pob
      - run: npm run details:import -- .upstream-pob --check
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
        env:
          SCREENSHOT_DIR: artifacts/browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-screenshots
          path: artifacts/browser
          retention-days: 7
          if-no-files-found: ignore
